.daybook {
  --bg: #fbf8f2;
  --ink: #302e2a;
  --muted: #71685d;
  --accent: #b64d43;
  --on-accent: #fffaf5;
  --surface: #fffdf9;
  --line: #e7e0d6;
  min-height: 100%;
  color: var(--ink);
  background: var(--bg);
  font-family: LabSans, "Aptos", "Segoe UI", sans-serif;
  font-size: calc(14px * var(--scale, 1));
  line-height: 1.45;
}

.daybook *,
.daybook *::before,
.daybook *::after { box-sizing: border-box; }
.daybook .daybook-paper { width: 100%; padding-bottom: 32px; }
.daybook h1,
.daybook p { margin-top: 0; }
.daybook .section { margin-top: 27px; }
.daybook .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.daybook .section-heading h2 { margin: 0; font: 500 calc(18px * var(--scale, 1))/1.2 Georgia, "Times New Roman", serif; letter-spacing: -.02em; }
.daybook .section-heading > span,
.daybook .section-heading .ledger-date,
.daybook .section-heading .practice-count,
.daybook .section-heading .agenda-kicker { color: var(--muted); font-size: calc(10px * var(--scale, 1)); font-weight: 650; letter-spacing: .12em; }

.daybook .daybook-opening { margin-top: 10px; padding: 15px 0 19px; border-bottom: 1px solid var(--line); }
.daybook .daybook-opening-note { display: flex; align-items: center; gap: 8px; margin-bottom: 11px; color: var(--muted); font-size: calc(10px * var(--scale, 1)); font-weight: 650; letter-spacing: .11em; }
.daybook .opening-mark { width: 8px; height: 8px; border: 1px solid var(--accent); border-radius: 50%; }
.daybook .primary-actions { display: grid; grid-template-columns: 1.2fr 1fr; gap: 9px; }
