<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stay Focused — FocusLock</title>
<link rel="stylesheet" href="../shared/theme-tokens.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; padding: 24px 16px; display: grid; place-items: center; background: var(--fl-background,#0d0d0f); color: var(--fl-on-surface,#eee9e7); font-family: var(--fl-font-family,"Segoe UI",Roboto,system-ui,-apple-system,BlinkMacSystemFont,sans-serif); }
  .card { width: 100%; max-width: 560px; min-width: 0; background: var(--fl-surface-container-low,#141416); border: 1px solid var(--fl-outline-variant,#353235); border-radius: var(--fl-radius-large,20px); padding: 32px; text-align: center; }
  .status { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .lock { display: grid; place-items: center; flex: 0 0 36px; height: 36px; border-radius: 10px; background: var(--fl-primary-container,#40302d); color: var(--fl-primary,#dfbdb6); }
  .lock svg { width: 20px; height: 20px; }
  h1 { margin: 20px 0 8px; font-size: clamp(28px, 5vw, 36px); line-height: 1.15; letter-spacing: -.035em; text-wrap: balance; }
  p.sub { color: var(--fl-on-surface-variant,#bbb4b1); margin: 0 auto 24px; max-width: 42ch; line-height: 1.5; }
  .pill { min-width: 0; max-width: 100%; background: var(--fl-error-container,#482725); color: var(--fl-error,#f2b2ad); border: 1px solid var(--fl-error,#f2b2ad); padding: 6px 12px; border-radius: 999px; font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
  .url { font-size: 13px; line-height: 1.5; color: var(--fl-on-surface-variant,#bbb4b1); overflow-wrap: anywhere; background: var(--fl-surface-container-lowest,#09090b); border: 1px solid var(--fl-outline-variant,#353235); border-radius: var(--fl-radius-medium,12px); padding: 10px 12px; margin: 0 0 20px; }
  .frog { text-align: left; background: var(--fl-surface-container-lowest,#09090b); border: 1px solid var(--fl-outline-variant,#353235); border-radius: var(--fl-radius-medium,12px); padding: 16px; margin: 0 0 20px; }
  .frog[hidden] { display: none; }
  .frog-kicker { color: var(--fl-primary,#dfbdb6); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  .frog-title { margin: 7px 0 5px; font-size: 17px; line-height: 1.4; font-weight: 700; overflow-wrap: anywhere; }
  .frog-meta { margin: 0; color: var(--fl-on-surface-variant,#bbb4b1); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
  .progress { height: 7px; margin: 13px 0 7px; overflow: hidden; border-radius: 99px; background: var(--fl-surface-container-high,#232326); }
  .progress > span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--fl-primary,#dfbdb6); transition: width .2s ease; }
  .progress-label { color: var(--fl-on-surface-variant,#bbb4b1); font-size: 12px; line-height: 1.5; }
  .frog-cta { margin-top: 12px; display: inline-block; font-size: 13px; line-height: 1.5; text-underline-offset: 3px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .row button { min-height: 44px; min-width: 0; flex: 1 1 0; }
  button { font-family: inherit; line-height: 1.4; cursor: pointer; border-radius: var(--fl-radius-medium,12px); border: 1px solid var(--fl-outline-variant,#353235); background: var(--fl-surface-container-high,#232326); color: var(--fl-on-surface,#eee9e7); padding: 11px 16px; font-size: 14px; font-weight: 650; transition: background .15s ease,border-color .15s ease,transform .15s ease; }
  #snoozeBtn { flex-basis: 100%; padding: 8px 12px; border-color: transparent; background: transparent; color: var(--fl-on-surface-variant,#bbb4b1); font-size: 13px; }
  #snoozeBtn:hover { background: var(--fl-surface-container-high,#232326); color: var(--fl-on-surface,#eee9e7); }
  button:hover { border-color: var(--fl-on-surface-variant,#bbb4b1); } button:active { transform: translateY(1px); }
  button.primary { background: var(--fl-primary,#dfbdb6); border-color: var(--fl-primary,#dfbdb6); color: var(--fl-on-primary,#30201d); }
  button.danger { background: var(--fl-error-container,#482725); border-color: var(--fl-error,#f2b2ad); color: var(--fl-error,#f2b2ad); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--fl-primary,#dfbdb6); outline-offset: 2px; }
  #snoozeBox { display: none; margin-top: 16px; text-align: left; background: var(--fl-surface-container-lowest,#09090b); border: 1px dashed var(--fl-outline-variant,#353235); border-radius: var(--fl-radius-medium,12px); padding: 16px; }
  #snoozeHelp { font-size: 13px; line-height: 1.5; color: var(--fl-on-surface-variant,#bbb4b1); }
  #phrase { color: var(--fl-warning,#e5c58f); }
  #snoozeBox label { display: block; margin-top: 12px; }
  #snoozeGo { width: 100%; min-height: 44px; }
  input { width: 100%; min-height: 44px; font-family: inherit; background: var(--fl-surface-container-low,#141416); color: var(--fl-on-surface,#eee9e7); border: 1px solid var(--fl-outline-variant,#353235); border-radius: var(--fl-radius-medium,12px); padding: 10px 12px; font-size: 14px; margin: 8px 0 12px; }
  .hint { font-size: 12px; line-height: 1.5; color: var(--fl-on-surface-variant,#bbb4b1); margin-top: 16px; }
  a { color: var(--fl-primary,#dfbdb6); }
  @media (max-width: 420px) { body { padding: 16px 12px; } .card { padding: 24px 20px; } }
  @media (max-width: 340px) { .row button { flex-basis: 100%; } }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
  <main class="card" aria-labelledby="blockedTitle">
    <div class="status">
      <div class="lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></div>
      <div class="pill" id="listPill">Blocked</div>
    </div>
    <h1 id="blockedTitle">Stay focused.</h1>
    <p class="sub">FocusLock blocked this page so future-you says thanks.</p>
    <div class="url" id="blockedUrl"></div>
    <section class="frog" id="frogCard" aria-live="polite" aria-busy="true">
      <div class="frog-kicker">Eat the Frog</div>
      <div class="frog-title" id="frogTitle">Loading today’s focus task…</div>
      <p class="frog-meta" id="frogMeta"></p>
      <div class="progress" id="frogProgress" role="progressbar" aria-label="Today's frog progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
      <div class="progress-label" id="frogProgressLabel" hidden></div>
      <a class="frog-cta" id="frogCta" href="#" hidden>Open FocusLock account →</a>
    </section>
    <div class="row">
      <button class="primary" id="dashboard">Account &amp; sync</button>
      <button id="goBack">Go back</button>
      <button id="snoozeBtn" hidden>Need 5 min?</button>
    </div>
    <div id="snoozeBox" aria-live="polite">
      <div id="snoozeHelp">Emergency break: type <b id="phrase"></b> then wait <b id="count">60</b>s. Frozen Turkey blocks cannot be bypassed.</div>
      <label for="phraseInput" class="hint">Type the phrase to start the wait</label>
      <input id="phraseInput" placeholder="type the phrase…" autocomplete="off" aria-describedby="snoozeHelp" />
      <button id="snoozeGo" class="danger" disabled>Unlock 5 minutes</button>
    </div>
    <div class="hint">Your boundary stays protected. <a href="#" id="closeTab">Close tab</a></div>
  </main>
<script src="blocked.js"></script>
</body>
</html>
