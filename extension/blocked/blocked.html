<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stay Focused — FocusLock</title>
<link rel="stylesheet" href="../shared/theme-tokens.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fl-background,#0d0d0f); color: var(--fl-on-surface,#eee9e7); font-family: var(--fl-font-family,"Segoe UI",Roboto,system-ui,-apple-system,BlinkMacSystemFont,sans-serif); }
  .card { width: min(560px, 92vw); background: var(--fl-surface-container-low,#141416); border: 1px solid var(--fl-outline-variant,#353235); border-radius: var(--fl-radius-large,20px); padding: 36px 32px; text-align: center; }
  @media (min-width: 700px) { .card { padding: 48px 44px; } }
  .lock { font-size: 16px; color: var(--fl-primary,#dfbdb6); font-weight: 800; letter-spacing:.08em; }
  h1 { margin: 16px 0 8px; font-size: clamp(28px, 5vw, 36px); letter-spacing: -.035em; }
  p.sub { color: var(--fl-on-surface-variant,#bbb4b1); margin: 0 auto 24px; max-width: 42ch; line-height: 1.5; }
  .pill { display: inline-block; background: var(--fl-error-container,#482725); color: var(--fl-error,#f2b2ad); border: 1px solid var(--fl-error,#f2b2ad); padding: 6px 14px; border-radius: 999px; font-size: 13px; margin-bottom: 14px; }
  .url { font-size: 13px; color: var(--fl-on-surface-variant,#bbb4b1); word-break: break-all; background: var(--fl-surface-container-lowest,#09090b); border: 1px solid var(--fl-outline-variant,#353235); border-radius: var(--fl-radius-medium,12px); padding: 10px 12px; margin: 0 0 18px; }
  .frog { text-align: left; background: var(--fl-surface-container-lowest,#09090b); border: 1px solid var(--fl-outline-variant,#353235); border-radius: var(--fl-radius-medium,12px); padding: 16px; margin: 0 0 20px; }
  .frog[hidden] { display: none; }
  .frog-kicker { color: var(--fl-primary,#dfbdb6); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  .frog-title { margin: 7px 0 5px; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
  .frog-meta { margin: 0; color: var(--fl-on-surface-variant,#bbb4b1); font-size: 13px; line-height: 1.45; }
  .progress { height: 7px; margin: 13px 0 7px; overflow: hidden; border-radius: 99px; background: var(--fl-surface-container-high,#232326); }
  .progress > span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--fl-primary,#dfbdb6); transition: width .2s ease; }
  .progress-label { color: var(--fl-on-surface-variant,#bbb4b1); font-size: 12px; }
  .frog-cta { margin-top: 12px; display: inline-block; font-size: 13px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .row button { min-height: 44px; }
  button { cursor: pointer; border-radius: var(--fl-radius-medium,12px); border: 1px solid var(--fl-outline-variant,#353235); background: var(--fl-surface-container-high,#232326); color: var(--fl-on-surface,#eee9e7); padding: 11px 18px; font-size: 14px; font-weight: 650; transition: background .15s ease,border-color .15s ease,transform .15s ease; }
  button:hover { border-color: var(--fl-on-surface-variant,#bbb4b1); } button:active { transform: translateY(1px); }
  button.primary { background: var(--fl-primary,#dfbdb6); border-color: var(--fl-primary,#dfbdb6); color: var(--fl-on-primary,#30201d); }
  button.danger { background: var(--fl-error-container,#482725); border-color: var(--fl-error,#f2b2ad); color: var(--fl-error,#f2b2ad); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--fl-primary,#dfbdb6); outline-offset: 2px; }
  #snoozeBox { display: none; margin-top: 16px; background: var(--fl-surface-container-lowest,#09090b); border: 1px dashed var(--fl-outline-variant,#353235); border-radius: var(--fl-radius-medium,12px); padding: 14px; }
  input { width: 100%; background: var(--fl-surface-container-low,#141416); color: var(--fl-on-surface,#eee9e7); border: 1px solid var(--fl-outline-variant,#353235); border-radius: var(--fl-radius-medium,12px); padding: 10px 12px; font-size: 14px; margin: 8px 0; }
  .hint { font-size: 12px; color: var(--fl-on-surface-variant,#bbb4b1); margin-top: 14px; }
  a { color: var(--fl-primary,#dfbdb6); }
  @media (max-width: 420px) { .card { padding: 30px 20px; } .row button { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <div class="pill" id="listPill">Blocked</div>
    <h1>Stay focused.</h1>
    <p class="sub">FocusLock blocked this page so future-you says thanks.</p>
    <div class="url" id="blockedUrl"></div>
    <section class="frog" id="frogCard" aria-live="polite" hidden>
      <div class="frog-kicker">Eat the Frog</div>
      <div class="frog-title" id="frogTitle"></div>
      <p class="frog-meta" id="frogMeta"></p>
      <div class="progress" id="frogProgress" role="progressbar" aria-label="Today's frog progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
      <div class="progress-label" id="frogProgressLabel"></div>
      <a class="frog-cta" id="frogCta" href="#" hidden>Open Eat the Frog in dashboard →</a>
    </section>
    <div class="row">
      <button class="primary" id="goBack">← Go back</button>
      <button id="dashboard">Open dashboard</button>
      <button id="snoozeBtn">Need 5 min?</button>
    </div>
    <div id="snoozeBox">
      <div style="font-size:13px;color:var(--fl-on-surface-variant,#bbb4b1)">Emergency break: type <b id="phrase" style="color:var(--fl-warning,#e5c58f)"></b> then wait <b id="count">60</b>s. Frozen Turkey blocks cannot be bypassed.</div>
      <input id="phraseInput" placeholder="type the phrase…" autocomplete="off" />
      <button id="snoozeGo" class="danger" disabled>Unlock 5 minutes</button>
    </div>
    <div class="hint">Cold Turkey rule: locked sessions can't be undone. <a href="#" id="closeTab">Close tab</a></div>
  </div>
<script src="blocked.js"></script>
</body>
</html>
