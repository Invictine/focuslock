<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FocusLock account</title>
  <link rel="stylesheet" href="../shared/theme-tokens.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--fl-background,#0d0d0f); color: var(--fl-on-surface,#eee9e7); font: 14px var(--fl-font-family,"Segoe UI",Roboto,system-ui,sans-serif); }
    main { width: min(100% - 32px, 620px); margin: 0 auto; padding: 42px 0 64px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .logo { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--fl-outline-variant,#353235); border-radius: 12px; color: var(--fl-primary,#dfbdb6); }
    .logo svg { width: 21px; height: 21px; }
    h1 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
    header p { margin: 3px 0 0; color: var(--fl-on-surface-variant,#bbb4b1); font-size: 12px; }
    .card { padding: 22px; border: 1px solid var(--fl-outline-variant,#353235); border-radius: 18px; background: var(--fl-surface-container,#1b1b1e); }
    .account-copy { display: flex; gap: 14px; align-items: flex-start; }
    .account-icon { width: 42px; height: 42px; display: grid; place-items: center; flex: none; border-radius: 12px; background: var(--fl-primary-container,#40302d); color: var(--fl-primary,#dfbdb6); }
    .account-icon svg { width: 20px; height: 20px; }
    .hero-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    h2 { margin: 0; font-size: 16px; }
    .d { margin: 6px 0 0; color: var(--fl-on-surface-variant,#bbb4b1); line-height: 1.5; }
    .badge { display: inline-flex; align-items: center; padding: 4px 9px; border: 1px solid var(--fl-outline-variant,#353235); border-radius: 99px; color: var(--fl-on-surface-variant,#bbb4b1); font-size: 11px; }
    .badge.good { color: var(--fl-success,#b7cbbb); border-color: var(--fl-success,#b7cbbb); }
    .account-state { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    #accountCloud, .mut { color: var(--fl-on-surface-variant,#bbb4b1); font-size: 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    button { min-height: 40px; padding: 0 14px; border: 1px solid var(--fl-outline-variant,#353235); border-radius: 11px; background: var(--fl-surface-container-high,#232326); color: var(--fl-on-surface,#eee9e7); font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { border-color: var(--fl-on-surface-variant,#bbb4b1); }
    button:focus-visible { outline: 2px solid var(--fl-primary,#dfbdb6); outline-offset: 2px; }
    button:disabled { opacity: .5; cursor: wait; }
    .primary { background: var(--fl-primary,#dfbdb6); border-color: var(--fl-primary,#dfbdb6); color: var(--fl-on-primary,#30201d); }
    .error { margin: 14px 0 0; color: var(--fl-error,#f2b2ad); line-height: 1.45; }
    #accountAuth { width: min(100%,480px); margin: 20px auto 0; }
    #accountAuth[hidden], [hidden] { display: none !important; }
    #accountDevicesCard { margin-top: 14px; }
    #accountDevicesCard > p { margin: 6px 0 12px; }
    .site-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--fl-outline-variant,#353235); }
    .site-row strong, .site-row .mut { display: block; }
    .site-row .mut { margin-top: 3px; }
    @media (max-width: 520px) { main { padding-top: 24px; } .card { padding: 17px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M12 15v2"/></svg></span>
      <div><h1>FocusLock account</h1><p>Keep Chrome tracking and your other devices in sync.</p></div>
    </header>
    <section class="card" id="accountCard" aria-labelledby="accountTitle">
      <div class="account-copy">
        <span class="account-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M12 15v2"/></svg></span>
        <div>
          <div class="hero-line"><h2 id="accountTitle">Connect your FocusLock account</h2><span class="badge" id="accountBadge">Not connected</span></div>
          <p class="d" id="accountDetail">Sync Chrome website time with Android and Windows.</p>
          <div class="account-state" id="accountState" aria-label="Device connection status"></div>
          <p id="accountCloud" aria-live="polite"></p>
        </div>
      </div>
      <div class="actions" aria-label="Account controls">
        <button class="primary" id="accountSignIn" type="button">Continue with Google or email</button>
        <button id="accountEmailSignIn" type="button" hidden>Use email instead</button>
        <button id="accountSync" type="button" hidden>Sync now</button>
        <button id="accountSignOut" type="button" hidden>Sign out</button>
      </div>
      <p class="error" id="accountError" role="alert" hidden></p>
      <div id="accountAuth" aria-label="FocusLock sign in" hidden></div>
    </section>
    <section class="card" id="accountDevicesCard" hidden>
      <h2>Connected devices</h2>
      <p class="mut" id="accountDeviceSummary">…</p>
      <div id="accountDevices"></div>
    </section>
  </main>
  <script src="../dist/options-auth.js"></script>
</body>
</html>
