<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  body { width: 340px; margin: 0; background: #020617; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; }
  .wrap { padding: 16px; }
  .site { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .site b { display: block; font-size: 14px; word-break: break-all; }
  .site span { font-size: 12px; color: #94a3b8; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  button { cursor: pointer; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; padding: 9px 10px; font-size: 13px; font-weight: 600; }
  button.go { background: #16a34a; border-color: #15803d; }
  button.stop { background: #7f1d1d; border-color: #991b1b; }
  button.full { width: 100%; margin-top: 8px; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  select, input { width: 100%; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-top: 6px; }
  .status { font-size: 12px; color: #4ade80; min-height: 16px; margin-top: 8px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #64748b; margin: 14px 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="site"><b id="domain">…</b><span id="today">today: …</span></div>
  <div class="row">
    <button id="blockSite" class="stop">Block this site</button>
    <button id="allowSite" class="go">Allow 5 min</button>
  </div>
  <h3>Start focus session</h3>
  <div class="grid">
    <button data-min="15">15 min</button>
    <button data-min="25">25 Pomodoro</button>
    <button data-min="50">50 min</button>
    <button data-min="90">90 deep</button>
  </div>
  <select id="listPick"></select>
  <div class="row" style="margin-top:8px">
    <button id="frozenBtn" class="stop">❄ Frozen lock</button>
    <button id="nuclearBtn" class="stop">☢ Nuclear</button>
  </div>
  <button id="openDash" class="full">Open dashboard</button>
  <div class="status" id="status"></div>
</div>
<script src="../src/matcher.js"></script>
<script src="../src/store.js"></script>
<script src="popup.js"></script>
</body>
</html>
